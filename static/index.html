<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Простой и красивый список задач с сохранением на сервере." />
  <title>Список задач</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✓</text></svg>" />
</head>
<body>
  <div class="app-wrapper">
    <!-- Animated gradient background -->
    <div class="bg-gradient" aria-hidden="true"></div>
    <div class="bg-blobs" aria-hidden="true">
      <span class="blob blob-1"></span>
      <span class="blob blob-2"></span>
      <span class="blob blob-3"></span>
    </div>

    <header class="site-header">
      <div class="header-inner">
        <a href="/" class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </span>
          <span class="brand-name">TaskFlow</span>
        </a>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Переключить тему" title="Переключить тему">
          <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>
    </header>

    <main class="main">
      <section class="hero">
        <h1 class="hero-title">Список задач</h1>
        <p class="hero-subtitle">Добавляйте, отмечайте и удаляйте дела — всё сохраняется автоматически.</p>
      </section>

      <section class="card glass" aria-label="Управление задачами">
        <!-- Add task form -->
        <form id="taskForm" class="task-form" autocomplete="off">
          <div class="input-group">
            <svg class="input-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            <input
              id="taskInput"
              type="text"
              class="task-input"
              placeholder="Что нужно сделать?"
              maxlength="500"
              required
              aria-label="Новая задача"
            />
          </div>
          <button type="submit" class="btn btn-primary">
            <span class="btn-text">Добавить</span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </button>
        </form>

        <!-- Filters & search -->
        <div class="toolbar">
          <div class="search-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input id="searchInput" type="text" class="search-input" placeholder="Поиск..." aria-label="Поиск задач" />
          </div>
          <div class="filters" role="group" aria-label="Фильтр задач">
            <button class="filter-btn active" data-filter="all" type="button">Все</button>
            <button class="filter-btn" data-filter="active" type="button">Активные</button>
            <button class="filter-btn" data-filter="completed" type="button">Выполненные</button>
          </div>
        </div>

        <!-- Tasks list -->
        <ul id="taskList" class="task-list" aria-live="polite"></ul>

        <!-- Empty / loading states -->
        <div id="emptyState" class="empty-state hidden">
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          </div>
          <p class="empty-title">Список пуст</p>
          <p class="empty-text">Добавьте первую задачу, чтобы начать.</p>
        </div>

        <div id="errorBanner" class="error-banner hidden" role="alert"></div>

        <!-- Footer / summary -->
        <div class="card-footer">
          <span id="taskCount" class="task-count">0 задач</span>
          <button id="clearCompleted" class="btn btn-ghost" type="button" disabled>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            <span>Очистить выполненные</span>
          </button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <p>Сделано с <span class="heart" aria-hidden="true">♥</span> на FastAPI · Данные хранятся в SQLite</p>
        <p class="footer-meta">TaskFlow · 2025</p>
      </div>
    </footer>
  </div>

  <!-- Template for a single task -->
  <template id="taskTemplate">
    <li class="task-item" role="listitem">
      <label class="task-checkbox">
        <input type="checkbox" class="task-check" />
        <span class="check-box" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </span>
      </label>
      <span class="task-title"></span>
      <button class="btn-delete" type="button" aria-label="Удалить задачу" title="Удалить">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </li>
  </template>

  <script src="/static/js/app.js"></script>
</body>
</html>
